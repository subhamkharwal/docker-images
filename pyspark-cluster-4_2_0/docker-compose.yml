services:
  ewd-pyspark-420-jupyter:
    image: easewithdata/pyspark-jupyter:4.2.0
    container_name: ewd-pyspark-420-jupyterlab
    ports:
        - 8888:8888
        - 4040:4040
        - 4041:4041
    environment:
        JUPYTER_PORT: 8888
        SPARK_UI_PORT: 4040
    volumes:
        # Same volume twice: /data keeps paths identical to the workers (needed
        # for Delta/shared files); /home/jupyter/data shows it in the file browser.
        - spark_data:/data:rw
        - spark_data:/home/jupyter/data:rw
  ewd-spark-420-master:
    image: easewithdata/spark-master:4.2.0
    #command: ln -s /usr/bin/python3 /usr/local/bin/python
    container_name: ewd-spark-420-master
    ports:
      - "8080:8080"
      - "7077:7077"
      - 15002:15002
      - 4050:4050
    environment:
      - INIT_DAEMON_STEP=setup_spark
    volumes:
        - spark_data:/data:rw

  ewd-spark-420-worker-1:
    image: easewithdata/spark-worker:4.2.0
    #command: ln -s /usr/bin/python3 /usr/local/bin/python
    container_name: ewd-spark-420-worker-1
    depends_on:
      - ewd-spark-420-master
    ports:
      - "8081:8081"
    environment:
      - "SPARK_MASTER=spark://ewd-spark-420-master:7077"
    volumes:
        - spark_data:/data:rw
  ewd-spark-420-worker-2:
    image: easewithdata/spark-worker:4.2.0
    #command: ln -s /usr/bin/python3 /usr/local/bin/python
    container_name: ewd-spark-420-worker
    depends_on:
      - ewd-spark-420-master
    ports:
      - "8082:8081"
    environment:
      - "SPARK_MASTER=spark://ewd-spark-420-master:7077"
    volumes:
        - spark_data:/data:rw
volumes:
  spark_data:
